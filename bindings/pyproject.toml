[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "hnsw-engine"
version = "0.1.0"
description = "HNSW vector index written from scratch in Rust, exposed to Python via PyO3"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["hnsw", "vector-search", "ann", "rag"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.maturin]
features = ["pyo3/extension-module"]
# Native module is injected into the `hnsw_engine` package as `._native`;
# the package's __init__ re-exports it. The pure-Python `hnsw_rag` helper
# package ships from the same source dir.
module-name = "hnsw_engine._native"
manifest-path = "Cargo.toml"
python-source = "python"
# maturin's mixed layout only packages the module named by `module-name` — the
# sibling `hnsw_rag` package would be missing from the built wheel (and only
# importable under `maturin develop`, which installs editable). Ship it
# explicitly; maturin strips the `python-source` prefix, so it lands at the
# wheel root and imports as `hnsw_rag`.
include = [{ path = "python/hnsw_rag/**/*.py", format = ["sdist", "wheel"] }]
