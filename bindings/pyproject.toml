[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "hnsw-engine"
version = "0.1.0"
description = "HNSW vector index written from scratch in Rust, exposed to Python via PyO3"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["hnsw", "vector-search", "ann", "rag"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.maturin]
features = ["pyo3/extension-module"]
# Native module is injected into the `hnsw_engine` package as `._native`;
# the package's __init__ re-exports it. The pure-Python `hnsw_rag` helper
# package ships from the same source dir.
module-name = "hnsw_engine._native"
manifest-path = "Cargo.toml"
python-source = "python"
