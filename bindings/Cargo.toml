[package]
name = "hnsw-engine-py"
description = "Python bindings (PyO3) for the from-scratch HNSW vector index"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hnsw_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
hnsw-engine = { path = "../engine" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
